<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>Block Media - AI-Powered Finance News with Bias Detection | Stocks, Crypto &amp; Commodities</title>
    <meta name="description" content="Get real-time stock market, cryptocurrency, and commodities news with AI-powered summaries and political bias detection. Track S&amp;P 500, NASDAQ, Bitcoin, Ethereum, Gold prices and more.">
    <meta name="keywords" content="stock market news, cryptocurrency news, AI news analysis, political bias detection, S&amp;P 500, NASDAQ, Bitcoin, Ethereum, Gold prices, financial news, market analysis">
    <meta name="author" content="Block Media" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://orbit-news-feed.lovable.app" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://orbit-news-feed.lovable.app" />
    
    
    <meta property="og:image" content="https://orbit-news-feed.lovable.app/og-image.png" />
    <meta property="og:site_name" content="Block Media" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://orbit-news-feed.lovable.app" />
    
    
    <meta name="twitter:image" content="https://orbit-news-feed.lovable.app/og-image.png" />
    
    <!-- Additional SEO -->
    <meta name="theme-color" content="#DC2626" />
    <meta name="msapplication-TileColor" content="#DC2626" />
    <link rel="icon" type="image/png" href="https://storage.googleapis.com/gpt-engineer-file-uploads/XgUFzih4Xrhjpq4kYIcgapwLciy1/uploads/1769789777457-Block Media Logo.png">
    
    <!-- Structured Data for Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Block Media",
      "url": "https://orbit-news-feed.lovable.app",
      "logo": "https://orbit-news-feed.lovable.app/logo.png",
      "description": "AI-powered financial news platform with political bias detection",
      "sameAs": []
    }
    </script>
    
    <!-- Structured Data for WebSite (Search Box) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Block Media",
      "url": "https://orbit-news-feed.lovable.app",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://orbit-news-feed.lovable.app/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    
    <!-- Structured Data for FinancialProduct -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Block Media",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Real-time stock quotes",
        "Cryptocurrency price tracking",
        "AI-powered news summaries",
        "Political bias detection",
        "Multi-perspective analysis"
      ]
    }
    </script>
    <meta property="og:title" content="Block Media - AI-Powered Finance News with Bias Detection | Stocks, Crypto &amp; Commodities">
  <meta name="twitter:title" content="Block Media - AI-Powered Finance News with Bias Detection | Stocks, Crypto &amp; Commodities">
  <meta property="og:description" content="Get real-time stock market, cryptocurrency, and commodities news with AI-powered summaries and political bias detection. Track S&amp;P 500, NASDAQ, Bitcoin, Ethereum, Gold prices and more.">
  <meta name="twitter:description" content="Get real-time stock market, cryptocurrency, and commodities news with AI-powered summaries and political bias detection. Track S&amp;P 500, NASDAQ, Bitcoin, Ethereum, Gold prices and more.">
</head>
